server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: civicfix-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
      enabled: true

# JWT Configuration
civicfix:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:3000,https://*.netlify.app}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  priority-weights:
    severity-weight: 25.0
    confirmation-weight: 5.0
    age-hourly-weight: 0.5
    overdue-penalty: 20.0
    reopen-penalty: 15.0

# Actuator Health
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
